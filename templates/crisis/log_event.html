{% extends "base.html" %}

{% block title %}Log Crisis Event - MindBridge{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="card">
        <div class="card-header">
            <h2>📝 Log Crisis Event</h2>
            <p style="color: var(--text-muted);">Track your experiences to identify patterns with your therapist</p>
        </div>

        <div class="alert alert-warning">
            <strong>⚠️ If you are in immediate danger, call 1199 or 999 now.</strong>
        </div>

        <form action="/crisis/events" method="POST">
            <div class="form-group">
                <label for="crisis_type">Crisis Type *</label>
                <select id="crisis_type" name="crisis_type" class="form-control" required>
                    <option value="">Select type</option>
                    <option value="suicidal_ideation">Suicidal Ideation</option>
                    <option value="severe_panic">Severe Panic</option>
                    <option value="severe_anxiety">Severe Anxiety</option>
                    <option value="self_harm_urge">Self-Harm Urge</option>
                    <option value="dissociation">Dissociation</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="severity_level">Severity (1-10) *</label>
                <input type="range" id="severity_level" name="severity_level" min="1" max="10" value="5" class="form-control" required>
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted);">
                    <span>1 (Mild)</span>
                    <span id="severity_display">5</span>
                    <span>10 (Severe)</span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">What happened? *</label>
                <textarea id="description" name="description" class="form-control" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="immediate_action_taken">What did you do?</label>
                <input type="text" id="immediate_action_taken" name="immediate_action_taken" class="form-control" placeholder="e.g., Called hotline, used breathing technique">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Log Event</button>
        </form>
    </div>
</div>

<script>
document.getElementById('severity_level').addEventListener('input', function(e) {
    document.getElementById('severity_display').textContent = e.target.value;
});
</script>
{% endblock %}
