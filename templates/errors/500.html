{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 8rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">500 - Server Error</h1>
    <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem;">
        Something went wrong on our end. We're working to fix it.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="javascript:location.reload()" class="btn btn-outline">Try Again</a>
    </div>
</div>
{% endblock %}
