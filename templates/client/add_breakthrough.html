<!-- templates/client/add_breakthrough.html -->
{% extends "base.html" %}
{% block title %}Add Breakthrough - MindBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-star-fill text-warning"></i> Log a Breakthrough</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title *</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" name="category" placeholder="e.g., emotional, behavioral, cognitive">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="impact_level" class="form-label">Impact Level</label>
                            <select class="form-select" id="impact_level" name="impact_level">
                                <option value="minor">Minor</option>
                                <option value="moderate" selected>Moderate</option>
                                <option value="significant">Significant</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="date_occurred" class="form-label">Date Occurred</label>
                        <input type="date" class="form-control" id="date_occurred" name="date_occurred" value="{{ now.strftime('%Y-%m-%d') }}">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="share_with_therapist" name="share_with_therapist" checked>
                        <label class="form-check-label" for="share_with_therapist">
                            Share with my therapist
                        </label>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('client.breakthroughs') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Breakthrough</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
