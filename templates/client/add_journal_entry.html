<!-- templates/client/add_journal_entry.html -->
{% extends "base.html" %}
{% block title %}New Journal Entry - MindBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-journal-plus"></i> New Journal Entry</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="note_type" class="form-label">Entry Type</label>
                        <select class="form-select" id="note_type" name="note_type">
                            <option value="between_session">Between Sessions</option>
                            <option value="weekly_journal">Weekly Journal</option>
                            <option value="pre_session">Pre-Session Notes</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">Title (Optional)</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Give your entry a title">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content *</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required placeholder="Write about your thoughts, feelings, and experiences..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="mood_before" class="form-label">Mood Before Writing (1-10)</label>
                            <input type="number" class="form-control" id="mood_before" name="mood_before" min="1" max="10">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="mood_after" class="form-label">Mood After Writing (1-10)</label>
                            <input type="number" class="form-control" id="mood_after" name="mood_after" min="1" max="10">
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="share_with_therapist" name="share_with_therapist" checked>
                        <label class="form-check-label" for="share_with_therapist">
                            Share this entry with my therapist
                        </label>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('client.journal') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Entry</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
