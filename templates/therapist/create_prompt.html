{% extends "base.html" %}

{% block title %}Create Prompt - MindBridge{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px;">
    <div class="card">
        <div class="card-header">
            <h2>Create Therapeutic Prompt</h2>
            <p style="color: var(--text-muted);">Create an exercise or reflection for your client</p>
        </div>

        <form action="/therapist/prompts" method="POST">
            <div class="form-group">
                <label for="client_id">Select Client *</label>
                <select id="client_id" name="client_id" class="form-control" required>
                    <option value="">Choose a client</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prompt_type">Prompt Type *</label>
                <select id="prompt_type" name="prompt_type" class="form-control" required>
                    <option value="">Select type</option>
                    <option value="grounding">Grounding</option>
                    <option value="reflection">Reflection</option>
                    <option value="cbt">CBT Exercise</option>
                    <option value="mindfulness">Mindfulness</option>
                    <option value="journaling">Journaling</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="prompt_content">Prompt Content *</label>
                <textarea id="prompt_content" name="prompt_content" class="form-control" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="instructions">Instructions (Optional)</label>
                <textarea id="instructions" name="instructions" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Create Prompt</button>
        </form>
    </div>
</div>
{% endblock %}
