{% extends "base.html" %}

{% block title %}Capsule - MindBridge{% endblock %}

{% block extra_css %}
<style>
  .message { padding:1rem;border-radius:12px;margin-bottom:1rem;max-width:75%; }
  .message-mine { background:var(--primary-light);color:white;margin-left:auto; }
  .message-theirs { background:var(--bg-light);margin-right:auto; }
  .message-time { font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem; }
  #messages-area { min-height:300px;max-height:500px;overflow-y:auto;padding:1rem;background:white;border:2px solid var(--border);border-radius:12px;margin-bottom:1.5rem; }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width:900px;">
  <div style="margin-bottom:1rem;">
    <a href="/messaging/inbox" class="btn btn-outline" style="font-size:0.85rem;padding:0.4rem 0.8rem;">← Back to Inbox</a>
  </div>

  <div class="card">
    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div>
        <h2 id="capsule-title">Loading...</h2>
        <p style="color:var(--text-muted);">Status: <span id="capsule-status-badge"></span></p>
      </div>
      <div id="capsule-actions"></div>
    </div>

    <div id="alert-area"></div>

    <!-- Messages -->
    <div id="messages-area">
      <p style="text-align:center;color:var(--text-muted);">Loading messages...</p>
    </div>

    <!-- Input -->
    <div id="message-input-area">
      <div class="form-group">
        <label>Add Message</label>
        <textarea id="message-content" class="form-control" rows="3" placeholder="Type your message..."></textarea>
      </div>
      <button id="send-btn" class="btn btn-primary">Send Message</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {

  const capsuleId = {{ capsule_id }};
  const userType  = "{{ session.user_type }}";
  const alertArea = document.getElementById('alert-area');
  let currentUserId = null;
  let capsuleStatus = null;

  function showAlert(msg, type = 'danger') {
    alertArea.innerHTML = `
      <div class="alert alert-${type}">
        ${msg}
        <button onclick="this.parentElement.remove()" style="float:right;background:none;border:none;cursor:pointer;font-size:1.2rem;">&times;</button>
      </div>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

function formatTime(str) {
    // Ensure the string is treated as UTC (append Z if no timezone info)
    const utcStr = str.endsWith('Z') || str.includes('+') ? str : str + 'Z';
    return new Date(utcStr).toLocaleString('en-GB', {
        day: 'numeric', month: 'short',
        hour: '2-digit', minute: '2-digit',
        timeZone: 'Africa/Nairobi'
    });
}

  // ── Mark capsule as read on open ─────────────────────────────────────────
  async function markRead() {
    try {
      await fetch(`/messaging/capsules/${capsuleId}/mark-read`, { method: 'POST' });
    } catch {}
  }

  // ── Load capsule ──────────────────────────────────────────────────────────
  async function loadCapsule() {
    try {
      const resp = await fetch(`/messaging/capsules/${capsuleId}`);
      const data = await resp.json();

      if (!resp.ok) { showAlert(data.error || 'Failed to load capsule.'); return; }

      const c = data.capsule;
      capsuleStatus = c.status;
      currentUserId = c.client_id; // will be overridden below if therapist

      document.getElementById('capsule-title').textContent = c.title;
      document.getElementById('capsule-status-badge').innerHTML =
        `<span style="display:inline-block;padding:0.2rem 0.75rem;border-radius:20px;font-size:0.85rem;font-weight:600;background:${c.status === 'open' ? 'rgba(123,165,145,0.2)' : 'rgba(139,123,139,0.2)'};color:${c.status === 'open' ? 'var(--success)' : 'var(--primary)'};">${c.status.toUpperCase()}</span>`;

// ── Priority banner (therapist only) ─────────────────────────────────
if (userType === 'therapist') {
  const priorityColors = {
    CRITICAL: { bg: '#fee2e2', border: '#dc2626', color: '#dc2626' },
    HIGH:     { bg: '#fed7aa', border: '#f59e0b', color: '#92400e' },
    MEDIUM:   { bg: '#fef9c3', border: '#eab308', color: '#713f12' },
    LOW:      { bg: 'rgba(123,165,145,0.1)', border: 'var(--success)', color: 'var(--success)' },
    ANALYZING:{ bg: '#eff6ff', border: '#3b82f6', color: '#1d4ed8' }
  };

  const isAnalyzing = !c.priority_analyzed_at;
  const displayLevel = isAnalyzing ? 'ANALYZING' : (c.priority_level || 'LOW');
  const pc = priorityColors[displayLevel] || priorityColors.LOW;

  let bannerContent;
  if (isAnalyzing) {
    bannerContent = `
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <span style="display:inline-block;width:14px;height:14px;border:2px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
        <strong>Analyzing messages…</strong>
        <span style="font-size:0.82rem;opacity:0.7;">Granite AI is reviewing the capsule — this usually takes under a minute.</span>
      </div>`;
  } else {
    const reasons = c.priority_reasons?.reasons?.slice(0, 2).join(' · ') || '';
    const analyzedAt = `Last analyzed ${formatTime(c.priority_analyzed_at)}`;
    bannerContent = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;">
        <div>
          <strong>Priority: ${c.priority_level}</strong>
          ${reasons ? ` &mdash; ${escapeHtml(reasons)}` : ''}
          <div style="font-size:0.8rem;opacity:0.7;margin-top:0.25rem;">${analyzedAt}</div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <span style="font-size:0.85rem;opacity:0.8;">Score: ${(c.priority_score || 0).toFixed(2)}</span>
          <button
            id="reanalyze-btn"
            onclick="reanalyzeCapsule()"
            style="padding:0.35rem 0.85rem;border-radius:8px;border:2px solid ${pc.border};background:transparent;color:${pc.color};cursor:pointer;font-size:0.82rem;font-weight:600;white-space:nowrap;transition:all 0.2s;">
            ⟳ Reanalyze
          </button>
        </div>
      </div>`;
  }

  alertArea.innerHTML = `
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <div id="priority-banner" style="padding:0.85rem 1.25rem;border-radius:10px;border:2px solid ${pc.border};background:${pc.bg};color:${pc.color};margin-bottom:1rem;">
      ${bannerContent}
    </div>`;

  // If still analyzing, poll every 4 seconds until priority_analyzed_at is set
  if (isAnalyzing) {
    if (window._analysisPollTimer) clearInterval(window._analysisPollTimer);
    window._analysisPollTimer = setInterval(async () => {
      try {
        const r = await fetch(`/messaging/capsules/${capsuleId}`);
        const d = await r.json();
        if (r.ok && d.capsule.priority_analyzed_at) {
          clearInterval(window._analysisPollTimer);
          window._analysisPollTimer = null;
          loadCapsule();
        }
      } catch {}
    }, 4000);
  } else {
    if (window._analysisPollTimer) {
      clearInterval(window._analysisPollTimer);
      window._analysisPollTimer = null;
    }
  }
}   // end if (userType === 'therapist')

      // ── Mark as read on opening ───────────────────────────────────────────
      markRead();

      // ── Actions based on status + user type ───────────────────────────────
      const actions = document.getElementById('capsule-actions');

      if (userType === 'client') {
        // CLIENT: can seal open capsules, archive sealed ones
        if (c.status === 'open') {
          actions.innerHTML = `<button class="btn btn-danger" id="seal-btn">🔒 Seal Capsule</button>`;
          document.getElementById('seal-btn').addEventListener('click', sealCapsule);
        } else {
          document.getElementById('message-input-area').style.display = 'none';
          actions.innerHTML = `<button class="btn btn-outline" onclick="archiveCapsule()">Archive</button>`;
        }
      } else {
        // THERAPIST: can reply but never seal.
        // Show "Mark as Read" (which archives from unread queue) and archive option.
        const therapistActions = [];
        therapistActions.push(`<button class="btn btn-outline" onclick="markAsRead()" title="Mark as read and return to inbox">✓ Mark as Read</button>`);
        if (c.status === 'sealed' || c.status === 'archived') {
          therapistActions.push(`<button class="btn btn-outline" onclick="archiveCapsule()" style="margin-left:0.5rem;">Archive</button>`);
        }
        actions.innerHTML = therapistActions.join('');
      }

      renderMessages(data.messages, c.client_id);

    } catch (e) {
      showAlert('Failed to load capsule.');
    }
  }

  function renderMessages(messages, clientId) {
    const area = document.getElementById('messages-area');

    if (messages.length === 0) {
      area.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:2rem;">No messages yet. Add the first one below.</p>`;
      return;
    }

    area.innerHTML = messages.map(m => {
      const isMine = m.sender_id === clientId;
      return `
        <div class="message ${isMine ? 'message-mine' : 'message-theirs'}">
          <p style="margin:0;">${escapeHtml(m.content)}</p>
          <div class="message-time">${formatTime(m.created_at)}</div>
        </div>`;
    }).join('');

    area.scrollTop = area.scrollHeight;
  }

  // ── Reanalyze capsule (called from priority banner button) ───────────────
  window.reanalyzeCapsule = async function() {
    const btn = document.getElementById('reanalyze-btn');
    if (!btn) return;

    btn.disabled = true;
    btn.textContent = 'Analyzing...';

    try {
      const resp = await fetch(`/messaging/api/therapist/capsules/${capsuleId}/reanalyze`, {
        method: 'POST'
      });
      const data = await resp.json();

      if (resp.ok) {
        showAlert('✓ Analysis updated — priority is now ' + data.analysis.priority_level, 'success');
        setTimeout(() => loadCapsule(), 800);
      } else {
        showAlert(data.error || 'Reanalysis failed.');
        btn.disabled = false;
        btn.textContent = '⟳ Reanalyze';
      }
    } catch (e) {
      showAlert('Network error during reanalysis.');
      btn.disabled = false;
      btn.textContent = '⟳ Reanalyze';
    }
  };

  // ── Send message ──────────────────────────────────────────────────────────
  document.getElementById('send-btn').addEventListener('click', async () => {
    const content = document.getElementById('message-content').value.trim();
    if (!content) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const resp = await fetch(`/messaging/capsules/${capsuleId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      const data = await resp.json();

      if (resp.ok) {
        document.getElementById('message-content').value = '';
        loadCapsule(); // refresh
      } else {
        showAlert(data.error || 'Failed to send message.');
      }
    } catch (e) {
      showAlert('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }
  });

  // ── Seal capsule ──────────────────────────────────────────────────────────
  async function sealCapsule() {
    if (!confirm('Seal this capsule? You will not be able to add more messages after sealing.')) return;

    try {
      const resp = await fetch(`/messaging/capsules/${capsuleId}/seal`, { method: 'POST' });
      const data = await resp.json();

      if (resp.ok) {
        showAlert('Capsule sealed. Your therapist can now read it. 🔒', 'success');
        setTimeout(() => loadCapsule(), 1000);
      } else {
        showAlert(data.error || 'Failed to seal capsule.');
      }
    } catch (e) {
      showAlert('Network error.');
    }
  }

  // ── Mark as Read ─────────────────────────────────────────────────────────
  window.markAsRead = async function() {
    await markRead();
    showAlert('Capsule marked as read. ✓', 'success');
    setTimeout(() => window.location = '/messaging/inbox', 800);
  };

  // ── Archive capsule ───────────────────────────────────────────────────────
  window.archiveCapsule = async function() {
    if (!confirm('Archive this capsule?')) return;

    try {
      const resp = await fetch(`/messaging/capsules/${capsuleId}/archive`, { method: 'POST' });
      const data = await resp.json();

      if (resp.ok) {
        window.location = '/messaging/inbox';
      } else {
        showAlert(data.error || 'Failed to archive.');
      }
    } catch (e) {
      showAlert('Network error.');
    }
  };

  // Enter to send
  document.getElementById('message-content').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) document.getElementById('send-btn').click();
  });

  loadCapsule();
});
</script>
{% endblock %}
