{% extends "base.html" %}

{% block title %}Capsule Conversation - MindBridge{% endblock %}

{% block extra_css %}
<style>
    .message {
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        max-width: 80%;
    }

    .message-client {
        background: var(--primary-light);
        margin-left: auto;
    }

    .message-therapist {
        background: var(--bg-light);
        margin-right: auto;
    }

    .message-time {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px;">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h2>Capsule: Daily Check-in</h2>
                <p style="color: var(--text-muted);">Status: <span class="status-badge status-open">OPEN</span></p>
            </div>
            <button class="btn btn-danger">Seal Capsule</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem; margin: 2rem 0;">
            <div class="message message-client">
                <p>Had a difficult day today. Feeling overwhelmed with work.</p>
                <div class="message-time">2:30 PM</div>
            </div>
        </div>

        <form action="/messaging/capsules/1/messages" method="POST">
            <div class="form-group">
                <label for="content">Add Message</label>
                <textarea id="content" name="content" class="form-control" rows="4" placeholder="Type your message..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
