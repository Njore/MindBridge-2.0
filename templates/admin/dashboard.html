<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBridge — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── TOKENS ─────────────────────────────────────────── */
    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --border:    #1e2330;
      --border-hi: #2a3045;
      --text:      #c8cfe0;
      --muted:     #5a6380;
      --accent:    #4f7cff;
      --accent-lo: rgba(79,124,255,.12);
      --red:       #ff4d6a;
      --red-lo:    rgba(255,77,106,.12);
      --amber:     #ffb347;
      --amber-lo:  rgba(255,179,71,.12);
      --green:     #3ddba4;
      --green-lo:  rgba(61,219,164,.12);
      --mono:      'DM Mono', monospace;
      --sans:      'Sora', sans-serif;
      --radius:    8px;
      --sidebar-w: 220px;
    }

    /* ── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
    }

    /* ── SIDEBAR ────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }
    .sidebar-logo {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      letter-spacing: -.3px;
    }
    .sidebar-logo small {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: .5px;
    }
    .nav { padding: 12px 10px; flex: 1; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, color .15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover  { background: var(--border); color: var(--text); }
    .nav-item.active { background: var(--accent-lo); color: var(--accent); }
    .nav-item .icon  { font-size: 15px; width: 18px; text-align: center; }
    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-family: var(--mono);
      padding: 1px 6px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── MAIN ───────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -.2px;
    }
    .topbar-sub {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 1px;
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--border);
      border: 1px solid var(--border-hi);
      color: var(--text);
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      transition: background .15s;
    }
    .refresh-btn:hover { background: var(--border-hi); }

    /* ── CONTENT PANELS ─────────────────────────────────── */
    .panel { display: none; padding: 28px; animation: fadein .2s ease; }
    .panel.active { display: block; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── STAT CARDS ─────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0 0 0 0;
      border-left: 3px solid var(--accent);
      border-radius: var(--radius) 0 0 var(--radius);
    }
    .stat-card.red::before  { border-color: var(--red); }
    .stat-card.amber::before { border-color: var(--amber); }
    .stat-card.green::before { border-color: var(--green); }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      font-family: var(--mono);
      line-height: 1;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── SECTION HEADER ─────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -.1px;
    }
    .section-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── FILTER BAR ─────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-bar input,
    .filter-bar select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-family: var(--mono);
      outline: none;
      transition: border-color .15s;
    }
    .filter-bar input:focus,
    .filter-bar select:focus { border-color: var(--accent); }
    .filter-bar select option { background: var(--surface); }

    /* ── TABLE ──────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    thead th {
      background: var(--border);
      padding: 10px 16px;
      text-align: left;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    tbody tr {
      border-top: 1px solid var(--border);
      transition: background .12s;
    }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    tbody td { padding: 10px 16px; vertical-align: middle; }
    .empty-row td {
      text-align: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 32px;
    }

    /* ── BADGES ─────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: .3px;
    }
    .badge-red    { background: var(--red-lo);   color: var(--red);   }
    .badge-amber  { background: var(--amber-lo); color: var(--amber); }
    .badge-green  { background: var(--green-lo); color: var(--green); }
    .badge-accent { background: var(--accent-lo); color: var(--accent); }
    .badge-muted  { background: var(--border);   color: var(--muted); }

    /* ── ACTION BUTTONS ─────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      border: 1px solid transparent;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn-ghost { background: var(--border); color: var(--text); border-color: var(--border-hi); }
    .btn-red   { background: var(--red-lo); color: var(--red); border-color: rgba(255,77,106,.25); }
    .btn-green { background: var(--green-lo); color: var(--green); border-color: rgba(61,219,164,.25); }
    .btn-accent { background: var(--accent-lo); color: var(--accent); border-color: rgba(79,124,255,.25); }

    /* ── MODAL ──────────────────────────────────────────── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      padding: 28px;
      width: 440px;
      max-width: 95vw;
    }
    .modal h3 { font-size: 15px; color: #fff; margin-bottom: 16px; }
    .modal label { font-size: 11px; color: var(--muted); font-family: var(--mono); display: block; margin-bottom: 5px; }
    .modal textarea, .modal input, .modal select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; border-radius: var(--radius);
      font-size: 13px; font-family: var(--sans); outline: none;
      transition: border-color .15s; resize: vertical;
    }
    .modal textarea:focus, .modal input:focus, .modal select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-actions .btn { padding: 8px 16px; font-size: 12px; }

    /* ── TOAST ──────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--text);
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      z-index: 200;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: none; }
    #toast.err  { border-color: var(--red); color: var(--red); }
    #toast.ok   { border-color: var(--green); color: var(--green); }

    /* ── LOADING ────────────────────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 12px; gap: 10px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SCORE BAR ──────────────────────────────────────── */
    .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .score-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .3s; }
    .score-bar-fill.high { background: var(--amber); }
    .score-bar-fill.critical { background: var(--red); }

    /* ── URGENCY PULSE ──────────────────────────────────── */
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .urgent-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red); display: inline-block;
      animation: pulse 1.4s ease infinite;
    }
  </style>
</head>
<body>

<!-- ── SIDEBAR ───────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span>MindBridge</span>
    <small>ADMIN CONSOLE</small>
  </div>
  <nav class="nav">
    <button class="nav-item active" onclick="navigate('overview')">
      <span class="icon">◈</span> Overview
    </button>
    <button class="nav-item" onclick="navigate('safety')">
      <span class="icon">⚑</span> Safety Alerts
      <span class="nav-badge" id="badge-safety" style="display:none"></span>
    </button>
    <button class="nav-item" onclick="navigate('backlog')">
      <span class="icon">◎</span> Notif Backlog
      <span class="nav-badge" id="badge-backlog" style="display:none"></span>
    </button>
    <button class="nav-item" onclick="navigate('users')">
      <span class="icon">⊹</span> Users
    </button>
    <button class="nav-item" onclick="navigate('relationships')">
      <span class="icon">⇌</span> Relationships
    </button>
    <button class="nav-item" onclick="navigate('crisis')">
      <span class="icon">△</span> Crisis Events
    </button>
    <button class="nav-item" onclick="navigate('ai-audit')">
      <span class="icon">◉</span> AI Audit
    </button>
    <button class="nav-item" onclick="navigate('erasure')">
      <span class="icon">⊘</span> Erasure Requests
      <span class="nav-badge" id="badge-erasure" style="display:none"></span>
    </button>
    <button class="nav-item" onclick="navigate('logs')">
      <span class="icon">≡</span> Activity Logs
    </button>
  </nav>
  <div class="sidebar-footer" id="last-refresh">—</div>
  <div style="padding: 10px 10px 14px;">
    <button class="nav-item" onclick="handleLogout()" style="color:var(--red);width:100%;">
      <span class="icon">⏻</span> Logout
    </button>
  </div>
</aside>

<!-- ── LOGOUT CONFIRMATION MODAL ──────────────────────────── -->
<div class="modal-backdrop" id="modal-logout">
  <div class="modal" style="width:360px;">
    <h3>Log out?</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:4px;">You will be returned to the login page.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-logout')">Cancel</button>
      <button class="btn btn-red" onclick="confirmLogout()">Log out</button>
    </div>
  </div>
</div>

<!-- ── MAIN ──────────────────────────────────────────────── -->
<main class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="panel-title">Overview</div>
      <div class="topbar-sub" id="panel-sub">Platform health at a glance</div>
    </div>
    <button class="refresh-btn" onclick="refreshCurrent()">↻ Refresh</button>
  </div>

  <!-- OVERVIEW -->
  <div class="panel active" id="panel-overview">
    <div class="stat-grid" id="stat-grid">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- SAFETY ALERTS -->
  <div class="panel" id="panel-safety">
    <div class="filter-bar">
      <select id="safety-reviewed" onchange="loadSafety()">
        <option value="">All</option>
        <option value="false" selected>Unreviewed</option>
        <option value="true">Reviewed</option>
      </select>
      <select id="safety-level" onchange="loadSafety()">
        <option value="">CRITICAL + HIGH</option>
        <option value="CRITICAL">CRITICAL only</option>
        <option value="HIGH">HIGH only</option>
      </select>
    </div>
    <div class="table-wrap" id="safety-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- NOTIFICATION BACKLOG -->
  <div class="panel" id="panel-backlog">
    <div class="table-wrap" id="backlog-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- USERS -->
  <div class="panel" id="panel-users">
    <div class="filter-bar">
      <input id="user-search" type="text" placeholder="Search name or email…" oninput="loadUsers()" />
      <select id="user-type" onchange="loadUsers()">
        <option value="">All types</option>
        <option value="client">Clients</option>
        <option value="therapist">Therapists</option>
      </select>
      <select id="user-active" onchange="loadUsers()">
        <option value="">Any status</option>
        <option value="true">Active</option>
        <option value="false">Inactive</option>
      </select>
      <select id="user-verified" onchange="loadUsers()">
        <option value="">Any verification</option>
        <option value="true">Verified</option>
        <option value="false">Unverified</option>
      </select>
    </div>
    <div class="table-wrap" id="users-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- RELATIONSHIPS -->
  <div class="panel" id="panel-relationships">
    <div class="filter-bar">
      <select id="rel-status" onchange="loadRelationships()">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="ended">Ended</option>
        <option value="">All</option>
      </select>
    </div>
    <div class="table-wrap" id="rel-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- CRISIS -->
  <div class="panel" id="panel-crisis">
    <div class="filter-bar">
      <select id="crisis-severity" onchange="loadCrisis()">
        <option value="1">All severities</option>
        <option value="5">≥ 5</option>
        <option value="7">≥ 7 (High)</option>
      </select>
      <select id="crisis-days" onchange="loadCrisis()">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
    </div>
    <div class="table-wrap" id="crisis-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- AI AUDIT -->
  <div class="panel" id="panel-ai-audit">
    <div class="table-wrap" id="audit-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- ERASURE REQUESTS -->
  <div class="panel" id="panel-erasure">
    <div class="filter-bar">
      <select id="erasure-status" onchange="loadErasure()">
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
    </div>
    <div class="table-wrap" id="erasure-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- ACTIVITY LOGS -->
  <div class="panel" id="panel-logs">
    <div class="filter-bar">
      <input id="log-user" type="text" placeholder="User ID…" style="width:90px" />
      <input id="log-action" type="text" placeholder="Action type…" />
      <select id="log-days" onchange="loadLogs()">
        <option value="1">Last 24h</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <button class="btn btn-ghost" onclick="loadLogs()">Filter</button>
    </div>
    <div class="table-wrap" id="logs-table">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>
</main>

<!-- ── MODALS ──────────────────────────────────────────────── -->
<!-- Dissolve relationship -->
<div class="modal-backdrop" id="modal-dissolve">
  <div class="modal">
    <h3>Dissolve Relationship</h3>
    <label>Reason (shown to both parties)</label>
    <textarea id="dissolve-reason" rows="3" placeholder="e.g. Therapist leaving platform"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-dissolve')">Cancel</button>
      <button class="btn btn-red" onclick="confirmDissolve()">Dissolve</button>
    </div>
  </div>
</div>

<!-- Erasure action -->
<div class="modal-backdrop" id="modal-erasure">
  <div class="modal">
    <h3 id="erasure-modal-title">Review Erasure Request</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5" id="erasure-modal-info"></p>
    <label>Admin notes</label>
    <textarea id="erasure-notes" rows="3" placeholder="Optional internal notes"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-erasure')">Cancel</button>
      <button class="btn btn-red" onclick="confirmErasure('reject')">Reject</button>
      <button class="btn btn-green" onclick="confirmErasure('approve')">Approve & Anonymize</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── STATE ───────────────────────────────────────────────────
let currentPanel = 'overview';
let dissolveRelId = null;
let erasureReqId  = null;

const PANELS = {
  overview:      { title: 'Overview',            sub: 'Platform health at a glance' },
  safety:        { title: 'Safety Alerts',        sub: 'CRITICAL and HIGH priority capsules' },
  backlog:       { title: 'Notification Backlog', sub: 'Therapists with unread crisis alerts' },
  users:         { title: 'Users',                sub: 'Manage clients and therapists' },
  relationships: { title: 'Relationships',        sub: 'Client-therapist pairings' },
  crisis:        { title: 'Crisis Events',        sub: 'Platform-wide crisis log' },
  'ai-audit':    { title: 'AI Audit',             sub: 'Capsules flagged by Granite analysis' },
  erasure:       { title: 'Erasure Requests',     sub: 'GDPR right-to-erasure queue' },
  logs:          { title: 'Activity Logs',        sub: 'Full audit trail' },
};

// ── NAVIGATION ──────────────────────────────────────────────
function navigate(panel) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`panel-${panel}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    if (n.getAttribute('onclick') === `navigate('${panel}')`) n.classList.add('active');
  });
  currentPanel = panel;
  document.getElementById('panel-title').textContent = PANELS[panel].title;
  document.getElementById('panel-sub').textContent   = PANELS[panel].sub;
  loadPanel(panel);
}

function refreshCurrent() { loadPanel(currentPanel); }

function loadPanel(panel) {
  const loaders = {
    overview:      loadOverview,
    safety:        loadSafety,
    backlog:       loadBacklog,
    users:         loadUsers,
    relationships: loadRelationships,
    crisis:        loadCrisis,
    'ai-audit':    loadAudit,
    erasure:       loadErasure,
    logs:          loadLogs,
  };
  if (loaders[panel]) loaders[panel]();
  setLastRefresh();
}

function setLastRefresh() {
  document.getElementById('last-refresh').textContent =
    'Updated ' + new Date().toLocaleTimeString();
}

// ── API HELPERS ─────────────────────────────────────────────
async function api(path) {
  const r = await fetch('/admin' + path, { credentials: 'same-origin' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch('/admin' + path, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || `HTTP ${r.status}`);
  }
  return r.json();
}

// ── TOAST ───────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3200);
}

// ── HELPERS ──────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
    + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function levelBadge(level) {
  const cls = { CRITICAL: 'badge-red', HIGH: 'badge-amber', MEDIUM: 'badge-accent', LOW: 'badge-muted' };
  return `<span class="badge ${cls[level] || 'badge-muted'}">${level}</span>`;
}

function statusBadge(s) {
  const cls = { open:'badge-accent', sealed:'badge-muted', active:'badge-green',
                resolved:'badge-green', logged:'badge-muted', in_progress:'badge-amber',
                escalated:'badge-red', ended:'badge-muted' };
  return `<span class="badge ${cls[s] || 'badge-muted'}">${s}</span>`;
}

function erasureStatusBadge(s) {
  const cls = { pending:'badge-amber', approved:'badge-green', completed:'badge-green', rejected:'badge-muted' };
  return `<span class="badge ${cls[s] || 'badge-muted'}">${s}</span>`;
}

function typeBadge(t) {
  return t === 'therapist'
    ? '<span class="badge badge-accent">Therapist</span>'
    : '<span class="badge badge-muted">Client</span>';
}

function emptyTable(msg) {
  return `<table><tbody><tr class="empty-row"><td colspan="10">${msg}</td></tr></tbody></table>`;
}
